---
- name: "Installing useful github repos"
  git:
    repo: "{{ item.repo }}"
    dest: "{{ item.location }}"
  loop:
    - { repo: "https://github.com/Flangvik/SharpCollection", location: "/opt/SharpCollection" }
    # - { repo: "https://github.com/danielmiessler/SecLists", location: "/opt/seclists" }
    - { repo: "https://github.com/strikoder/CredSpray", location: "/opt/credspray" }
  become: true
  become_method: sudo

- name: Create temporary build directory
  ansible.builtin.tempfile:
    state: directory
  register: build_dir

# TODO: Add in toolings that require extraction of gh releases.

- name: Remove temporary build directory
  ansible.builtin.file:
    path: "{{ build_dir.path }}"
    state: absent
  when: build_dir.path is defined